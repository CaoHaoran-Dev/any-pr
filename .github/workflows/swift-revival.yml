name: Swift Revival

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次号'
        required: true
        default: '0'
      prepare:
        description: '是否重新生成清单（首次填 true）'
        required: false
        default: 'false'
  schedule:
    - cron: '*/1 * * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch swift
        run: |
          git remote add swift https://github.com/swiftlang/swift.git
          git fetch swift +main:refs/remotes/swift/main --depth=1

      - name: Build manifest
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PREPARE: ${{ github.event.inputs.prepare || 'false' }}
        run: |
          set -euo pipefail

          git config user.name "CaoHaoran-Dev"
          git config user.email "CaoHaoran-Dev@users.noreply.github.com"

          if git fetch origin swift-manifest:refs/remotes/origin/swift-manifest --depth=1 2>/dev/null; then
            git show origin/swift-manifest:clean_files.txt > clean_files.txt 2>/dev/null || true
          fi

          if [ ! -s clean_files.txt ] || [ "$PREPARE" = "true" ]; then
            echo "Building manifest..."

            git ls-tree -r --name-only swift/main \
              | grep -viE '^\.github(/|$)' \
              | grep -viE '(^|/)((un)?licen[cs]e|licen[cs]es?|copying|copyright|readme)([._-][a-z0-9]+)*$' \
              | grep -viE '~$|\.(tmp|temp|bak|sav|old|orig|rej|sw[a-z]|log)$|(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|(^|/)(__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|\.ipynb_checkpoints|\.tox|\.nox|\.cache|\.parcel-cache|\.turbo|\.nyc_output|node_modules|dist|build|out|target|coverage|obj|\.next|\.nuxt|\.output|\.gradle|\.vercel)/|\.(eslintcache|stylelintcache|py[co]|o|obj|a|lib|so|dylib|dll|exe|com|msi|apk|aab|ipa|dmg|deb|rpm|class|jar|war|ear|whl|egg|wasm|pdb|bin|db|sqlite3?|zip|tgz|tar|tar\.(gz|bz2|xz|zst)|gz|bz2|xz|7z|rar|zst)$' \
              | grep -viE '(^|/)\.env([._-](example|sample|template|dist)$|[._-][a-z0-9._-]*$)?$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|(^|/)credentials(\.json)?$|(^|/)\.(npmrc|netrc|pgpass|htpasswd)$|\.(pem|key|p12|pfx|jks|keystore|kdbx|ovpn)$' \
              > all_files.txt

            while read -r f; do
              [ -z "$f" ] && continue
              lines=$(git show "swift/main:$f" 2>/dev/null | wc -l) || continue
              if [ "$lines" -le 300 ]; then
                printf '%d\t%s\n' "$lines" "$f"
              fi
            done < all_files.txt > clean_files.txt

            git checkout --orphan swift-manifest-tmp
            git rm -rf . >/dev/null 2>&1 || true
            cp clean_files.txt clean_files.txt.tmp
            git add clean_files.txt.tmp
            git commit -m "Update manifest" || true
            git push origin HEAD:swift-manifest --force
            mv clean_files.txt.tmp clean_files.txt
            git checkout -f main
          fi

          echo "Manifest size: $(wc -l < clean_files.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: clean-files
          path: clean_files.txt
          retention-days: 30

  revive:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      max-parallel: 3
      matrix:
        slot: [0, 1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: clean-files

      - name: Fetch target and swift
        run: |
          git config user.name "CaoHaoran-Dev"
          git config user.email "CaoHaoran-Dev@users.noreply.github.com"

          git remote add target https://github.com/any-pr/any-pr.git
          git fetch target +main:refs/remotes/target/main --depth=1

          git remote add swift https://github.com/swiftlang/swift.git
          git fetch swift +main:refs/remotes/swift/main --depth=1

      - name: Build batch for this slot
        env:
          BATCH: ${{ github.event.inputs.batch || 0 }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          IDX=$((BATCH * 3 + SLOT))
          mkdir -p /tmp/swift-revival

          awk -v target="$IDX" '
            BEGIN { batch=0; lines=0; files=0 }
            {
              n=$1
              f=$2
              if (files > 0 && (lines + n > 500 || files >= 20)) {
                batch++
                lines=0
                files=0
              }
              if (batch == target) { print f > "/tmp/swift-revival/mybatch.txt" }
              lines += n
              files++
            }
          ' clean_files.txt

          if [ -s /tmp/swift-revival/mybatch.txt ]; then
            echo "Batch ${IDX}: $(wc -l < /tmp/swift-revival/mybatch.txt) files"
          else
            echo "No files for batch ${IDX}."
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Create PR
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || 0 }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          IDX=$((BATCH * 3 + SLOT))

          git fetch target +main:refs/remotes/target/main --depth=1
          git checkout -f target/main
          git clean -fdx
          git reset --hard target/main

          BRANCH="swift-revival-batch-${IDX}"
          git checkout -B "$BRANCH" target/main

          mkdir -p swift
          while read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "swift/$(dirname "$f")"
            git show "swift/main:$f" > "swift/$f" 2>/dev/null || true
          done < /tmp/swift-revival/mybatch.txt

          git add swift/
          git commit -m "Swift Revival: batch ${IDX}" || { echo "Nothing to commit."; exit 0; }
          git push origin "$BRANCH" --force || true

          gh pr create --repo any-pr/any-pr \
            --head "CaoHaoran-Dev:$BRANCH" \
            --base main \
            --title "Swift Revival: batch ${IDX}" \
            --body "让我们联合起来抵抗Java" \
            || true

  next:
    needs: [revive]
    runs-on: ubuntu-latest
    if: always() && needs.revive.result != 'failure'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.batch || 0 }} + 1 ))
          gh workflow run swift-revival.yml \
            --repo ${{ github.repository }} \
            -f batch=$NEXT \
            -f prepare=false