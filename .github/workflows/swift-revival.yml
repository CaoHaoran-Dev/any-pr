name: Swift Revival

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次号'
        required: true
        default: '0'
      skip_prepare:
        description: '跳过 fetch/过滤，直接用已有清单'
        required: false
        default: 'false'
  schedule:
    - cron: '*/2 * * * *'

jobs:
  prepare:
    if: github.event.inputs.skip_prepare != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch swiftlang/swift
        run: |
          git remote add swift https://github.com/swiftlang/swift.git
          git fetch swift main:refs/remotes/swift/main --depth=1
      - name: Build clean file list
        run: |
          git ls-tree -r --name-only swift/main \
            | grep -viE '^\.github/|^LICENSE|^README|\.(png|jpg|jpeg|gif|svg|ico|jar|so|dll|exe|bin|zip|gz|tar|pem|key|p12|pfx)$' \
            | while read -r f; do
                lines=$(git show "swift/main:$f" 2>/dev/null | wc -l)
                if [ "$lines" -le 300 ]; then echo "$f"; fi
              done > clean_files.txt
          echo "Clean files: $(wc -l < clean_files.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: clean-files
          path: clean_files.txt
          retention-days: 30

  revive:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: clean-files

      - name: Slice and PR
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || 0 }}
        run: |
          set -euo pipefail
          git config user.name "CaoHaoran-Dev"
          git config user.email "CaoHaoran-Dev@users.noreply.github.com"

          # 从目标仓库的 main 拉分支，避免 .github/ 混进 diff
          git remote add target https://github.com/any-pr/any-pr.git
          git fetch target main:refs/remotes/target/main --depth=1

          # 加 swift remote，并把远程 main 拉成本地 swift/main
          git remote add swift https://github.com/swiftlang/swift.git
          git fetch swift main:refs/remotes/swift/main --depth=1

          START=$((BATCH * 5))
          sed -n "$((START+1)),$((START+5))p" clean_files.txt > batch.txt
          [ -s batch.txt ] || { echo "No more files."; exit 0; }

          BRANCH="swift-revival-batch-${BATCH}"
          git checkout -B "$BRANCH" target/main

          mkdir -p swift
          while read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "swift/$(dirname "$f")"
            git show "swift/main:$f" > "swift/$f" 2>/dev/null || true
          done < batch.txt

          git add swift/
          git commit -m "Swift Revival: batch ${BATCH}" || { echo "Nothing to commit."; exit 0; }
          git push origin "$BRANCH" --force-with-lease

          gh pr create --repo any-pr/any-pr \
            --head "CaoHaoran-Dev:$BRANCH" \
            --base main \
            --title "Swift Revival: batch ${BATCH}" \
            --body "编译语言才是王道，JVM简直没技巧。" \
            || true

      - name: Trigger next batch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.batch || 0 }} + 1 ))
          gh workflow run swift-revival.yml \
            --repo ${{ github.repository }} \
            -f batch=$NEXT \
            -f skip_prepare=true