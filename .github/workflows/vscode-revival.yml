name: VSCode Revival

on:
  workflow_dispatch:
    inputs:
      batch:
        description: '批次号'
        required: true
        default: '0'
      prepare:
        description: '是否重新生成清单（首次填 true）'
        required: false
        default: 'false'
  schedule:
    - cron: '*/1 * * * *'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fetch vscode
        run: |
          git remote add vscode https://github.com/microsoft/vscode.git
          git fetch vscode +main:refs/remotes/vscode/main --depth=1

      - name: Build manifest
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          PREPARE: ${{ github.event.inputs.prepare || 'false' }}
        run: |
          set -euo pipefail

          git config user.name "CaoHaoran-Dev"
          git config user.email "CaoHaoran-Dev@users.noreply.github.com"

          if git fetch origin vscode-manifest:refs/remotes/origin/vscode-manifest --depth=1 2>/dev/null; then
            git show origin/vscode-manifest:clean_files.txt > clean_files.txt 2>/dev/null || true
          fi

          if [ ! -s clean_files.txt ] || [ "$PREPARE" = "true" ]; then
            echo "Building manifest..."

            git ls-tree -r --name-only vscode/main \
              | grep -viE '^\.github(/|$)' \
              | grep -viE '(^|/)((un)?licen[cs]e|licen[cs]es?|copying|copyright|readme)([._-][a-z0-9]+)*$' \
              | grep -viE '~$|\.(tmp|temp|bak|sav|old|orig|rej|sw[a-z]|log)$|(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|(^|/)(__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|\.ipynb_checkpoints|\.tox|\.nox|\.cache|\.parcel-cache|\.turbo|\.nyc_output|node_modules|dist|build|out|target|coverage|obj|\.next|\.nuxt|\.output|\.gradle|\.vercel|vendor|\.vscode|\.vscode-test|\.devcontainer|\.idea|\.vs|venv|\.venv)/|\.(eslintcache|stylelintcache|py[co]|o|obj|a|lib|so|dylib|dll|exe|com|msi|apk|aab|ipa|dmg|deb|rpm|class|jar|war|ear|whl|egg|wasm|pdb|bin|db|sqlite3?|zip|tgz|tar|tar\.(gz|bz2|xz|zst)|gz|bz2|xz|7z|rar|zst|map|snap|lockb?)$|\.min\.(js|css)$|(^|/)(package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|composer\.lock|Cargo\.lock|Gemfile\.lock|poetry\.lock|Pipfile\.lock|go\.sum)$|(^|/)(\.gitignore|\.gitattributes|\.gitmodules|\.git-blame-ignore-revs|\.editorconfig|\.nvmrc|\.mailmap|\.vscodeignore|\.npmignore|\.dockerignore|\.gitkeep|\.prettierignore|\.eslintignore)(\.[a-z]+)?$|(^|/)(\.prettierrc|\.eslintrc)(\.[a-z]+)?$|(^|/)(cgmanifest\.json|ThirdPartyNotices\.txt)$' \
              | grep -viE '(^|/)\.env([._-](example|sample|template|dist)$|[._-][a-z0-9._-]*$)?$|(^|/)id_(rsa|dsa|ecdsa|ed25519)$|(^|/)credentials(\.json)?$|(^|/)\.(npmrc|netrc|pgpass|htpasswd)$|\.(pem|key|p12|pfx|jks|keystore|kdbx|ovpn)$' \
              > all_files.txt

            while read -r f; do
              [ -z "$f" ] && continue
              lines=$(git show "vscode/main:$f" 2>/dev/null | wc -l) || continue
              if [ "$lines" -le 300 ]; then
                printf '%d\t%s\n' "$lines" "$f"
              fi
            done < all_files.txt > clean_files.txt

            # plumbing：只推一个 clean_files.txt，不碰工作区
            BLOB=$(git hash-object -w clean_files.txt)
            TREE=$(printf '100644 blob %s\tclean_files.txt\n' "$BLOB" | git mktree)
            COMMIT=$(git commit-tree "$TREE" -m "Update manifest")
            git push origin "$COMMIT:refs/heads/vscode-manifest" --force
          fi

          echo "Manifest size: $(wc -l < clean_files.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: clean-files
          path: clean_files.txt
          retention-days: 30

  revive:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      max-parallel: 3
      matrix:
        slot: [0, 1, 2]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: clean-files

      - name: Fetch target, fork and vscode
        run: |
          git config user.name "CaoHaoran-Dev"
          git config user.email "CaoHaoran-Dev@users.noreply.github.com"

          git remote add target https://github.com/any-pr/any-pr.git
          git fetch target +main:refs/remotes/target/main --depth=1

          git remote add fork "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/CaoHaoran-Dev/any-pr.git"
          git fetch fork +main:refs/remotes/fork/main --depth=1 || true

          git remote add vscode https://github.com/microsoft/vscode.git
          git fetch vscode +main:refs/remotes/vscode/main --depth=1

      - name: Build batch for this slot
        env:
          BATCH: ${{ github.event.inputs.batch || 0 }}
          SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          IDX=$((BATCH * 3 + SLOT))
          mkdir -p /tmp/vscode-revival

          awk -v target="$IDX" '
            BEGIN { batch=0; lines=0; files=0 }
            {
              n=$1
              f=$2
              if (files > 0 && (lines + n > 500 || files >= 20)) {
                batch++
                lines=0
                files=0
              }
              if (batch == target) { print f > "/tmp/vscode-revival/mybatch.txt" }
              lines += n
              files++
            }
          ' clean_files.txt

          if [ -s /tmp/vscode-revival/mybatch.txt ]; then
            echo "Batch ${IDX}: $(wc -l < /tmp/vscode-revival/mybatch.txt) files"
          else
            echo "No files for batch ${IDX}."
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Create PR
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          BATCH: ${{ github.event.inputs.batch || 0 }}
          SLOT: ${{ matrix.slot }}
          FORK_OWNER: CaoHaoran-Dev
          UPSTREAM: any-pr/any-pr
        run: |
          set -euo pipefail
          IDX=$((BATCH * 3 + SLOT))

          git fetch target +main:refs/remotes/target/main --depth=1
          git checkout -f target/main
          git clean -fdx
          git reset --hard target/main

          BRANCH="vscode-revival-batch-${IDX}"
          git checkout -B "$BRANCH" target/main

          mkdir -p vscode
          while read -r f; do
            [ -z "$f" ] && continue
            mkdir -p "vscode/$(dirname "$f")"
            if ! git show "vscode/main:$f" > "vscode/$f" 2>/dev/null; then
              echo "WARN: cannot read $f from vscode/main"
              rm -f "vscode/$f"
            fi
          done < /tmp/vscode-revival/mybatch.txt

          git add vscode/
          if git diff --cached --quiet; then
            echo "Nothing to commit — file(s) already in target."
            exit 0
          fi
          git commit -m "VSCode Revival: batch ${IDX}"
          git push fork "$BRANCH" --force || true

          gh pr create --repo "$UPSTREAM" \
            --head "${FORK_OWNER}:${BRANCH}" \
            --base main \
            --title "VSCode Revival: batch ${IDX}" \
            --body "搬 VSCode，Electron 才是王道" \
            || true

  next:
    needs: [revive]
    runs-on: ubuntu-latest
    if: always() && needs.revive.result != 'failure'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Check if more batches
        id: check
        env:
          BATCH: ${{ github.event.inputs.batch || 0 }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          TOTAL=0
          rm -f clean_files.txt
          if git fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
               +vscode-manifest:refs/remotes/origin/vscode-manifest --depth=1; then
            git show origin/vscode-manifest:clean_files.txt > clean_files.txt 2>/dev/null || true
          else
            echo "manifest fetch failed"
          fi
          if [ -s clean_files.txt ]; then
            TOTAL=$(wc -l < clean_files.txt)
          fi

          NEXT=$((BATCH + 1))
          HIT=$(awk -v t0="$((NEXT*3))" -v t1="$((NEXT*3+1))" -v t2="$((NEXT*3+2))" '
            BEGIN { batch=0; lines=0; files=0; hit=0 }
            {
              n=$1
              if (files > 0 && (lines + n > 500 || files >= 20)) {
                batch++; lines=0; files=0
              }
              if (batch == t0 || batch == t1 || batch == t2) { hit=1 }
              lines += n; files++
            }
            END { print hit }
          ' clean_files.txt)
          echo "Total files: ${TOTAL}; next batches ${NEXT}*3..+2 have files: ${HIT}"
          if [ "$HIT" = "1" ]; then
            echo "more=true" >> $GITHUB_OUTPUT
          else
            echo "more=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger next batch
        if: steps.check.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          NEXT=$(( ${{ github.event.inputs.batch || 0 }} + 1 ))
          gh workflow run vscode-revival.yml \
            --repo ${{ github.repository }} \
            -f batch=$NEXT \
            -f prepare=false